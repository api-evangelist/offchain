aid: offchain
name: Offchain
description: >-
  Offchain (formerly Offchain Labs) is a blockchain infrastructure company that
  builds and maintains core technology for the Ethereum ecosystem. It is the
  creator of Arbitrum, the leading Ethereum layer-2 scaling solution offering
  high throughput with Ethereum-grade security; Prysm, a Go implementation of
  the Ethereum proof-of-stake consensus client that powers roughly a quarter of
  the network's consensus nodes; and Stylus, which lets developers write smart
  contracts in Rust, C, and C++ compiled to WebAssembly. Offchain also operates
  ZeroDev (smart-account / ERC-4337 account-abstraction infrastructure) and the
  Arbitrum (Orbit) chain SDK for launching custom layer-2 and layer-3 chains.
  The developer surface is Ethereum-compatible JSON-RPC plus first-party
  TypeScript and Solidity libraries published under the @arbitrum npm scope; the
  company does not expose a single hosted REST API. Backed by Redpoint Ventures.
