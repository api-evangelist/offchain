source: >-
  https://github.com/OffchainLabs and the public npm registry
  (https://registry.npmjs.org). Offchain (formerly Offchain Labs) ships its
  developer libraries under the @arbitrum npm scope; each entry below was
  confirmed live against the registry (latest version, repository, and
  description) at fetch time. npm's web front-end returns 403 to automated
  clients, so versions were confirmed via registry.npmjs.org.
description: >-
  First-party client libraries for building on Arbitrum, the layer-2 chain
  built by Offchain. These are TypeScript/Solidity libraries for interacting
  with Arbitrum chains, deploying the Nitro rollup precompiles/contracts, and
  launching custom Arbitrum (Orbit) chains. There is no single hosted REST API;
  the platform surface is Ethereum-compatible JSON-RPC plus these SDKs.
